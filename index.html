<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<style>
/* 手机扫码访问（右上角 github-corner 斜切风：默认切半成三角形，hover/聚焦/点击展开完整二维码） */
.qr-mini{position:fixed;top:10px;right:10px;z-index:180;width:60px;height:60px;background:#fff;border-radius:13px;padding:9px;cursor:pointer;filter:drop-shadow(0 5px 14px rgba(0,0,0,.3));clip-path:polygon(0 0,100% 0,100% 100%);transition:clip-path .18s ease,transform .18s ease,filter .18s ease}
.qr-mini:hover,.qr-mini:focus,.qr-mini.active{clip-path:none;transform:scale(1.18);filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));outline:none}
.qr-mini-img{width:100%;height:100%;display:block;image-rendering:pixelated;border-radius:4px}
.qr-pop{position:fixed;top:80px;right:12px;z-index:181;width:248px;background:#fff;border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.3);padding:16px 16px 12px;text-align:center;display:none;animation:qrpIn .18s ease}
.qr-pop.show{display:block}
@keyframes qrpIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.qr-pop .qr-x{position:absolute;top:6px;right:10px;font-size:18px;color:#bbb;cursor:pointer;line-height:1}
.qr-pop .qr-x:hover{color:#666}
.qr-pop h4{font-size:14px;color:#333;margin-bottom:2px}
.qr-pop p{font-size:11.5px;color:#888;line-height:1.6;margin-bottom:10px}
.qr-pop .qr-img{width:200px;height:200px;margin:0 auto;display:block;image-rendering:pixelated;border-radius:8px;background:#fff}
.qr-pop .qr-url{font-size:11px;color:#4facfe;word-break:break-all;margin-top:10px;line-height:1.4}
.qr-pop .qr-warn{font-size:10.5px;color:#aaa;margin-top:6px;line-height:1.5}
.qr-pop .qr-err{font-size:12px;color:#c62828;line-height:1.6;padding:8px 0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,.option,.card{touch-action:manipulation}
#app{width:100%;max-width:500px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
/* 顶部导航 */
.header{background:linear-gradient(135deg,#4facfe,#00f2fe);padding:20px 20px 15px;text-align:center;position:relative}
.header h1{color:#fff;font-size:20px;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.header .sub{color:#e8f4ff;font-size:12px;margin-top:5px}
.progress-wrap{background:rgba(255,255,255,.3);border-radius:10px;height:10px;margin-top:12px;overflow:hidden}
.progress-bar{background:linear-gradient(90deg,#ffd700,#ff8c00);height:100%;border-radius:10px;transition:width .5s ease}
.progress-text{color:#fff;font-size:11px;margin-top:6px;font-weight:600}
/* 主界面 */
.main{padding:20px}
.loading{padding:40px 20px;text-align:center;color:#888;font-size:14px}
.load-error{padding:24px 20px;text-align:center;color:#c62828;font-size:14px;line-height:1.8}
/* 关卡地图 */
.map-title{font-size:16px;font-weight:700;color:#333;margin-bottom:15px;text-align:center}
.map-sub{font-size:12px;color:#888;margin:-8px 0 15px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#f8f9ff;border:2px solid #e0e3ff;border-radius:15px;padding:15px;text-align:center;cursor:pointer;transition:all .3s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.card.locked{opacity:.4;cursor:not-allowed;background:#f0f0f0;border-color:#ddd}
.card.completed{border-color:#4caf50;background:#e8f5e9}
.card.current{border-color:#ff9800;background:#fff3e0;animation:pulse 2s infinite}
.card .icon{font-size:32px;display:block;margin-bottom:8px}
.card .name{font-size:13px;font-weight:700;color:#333}
.card .unit-en{font-size:11px;color:#4facfe;margin-top:3px;line-height:1.4;font-style:italic}
.card .status{font-size:11px;color:#999;margin-top:6px}
.card .stars{color:#ffd700;font-size:14px;margin-top:4px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,152,0,.4)}50%{box-shadow:0 0 0 8px rgba(255,152,0,0)}}
/* 答题界面 */
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.quiz-title{font-size:15px;font-weight:700;color:#333}
.quiz-unit-en{font-size:12px;font-weight:400;color:#4facfe;margin-top:2px;font-style:italic;line-height:1.3}
.quiz-count{font-size:13px;color:#666}
.question-box{background:#f8f9ff;border-radius:15px;padding:20px;margin-bottom:15px;border:2px solid #e0e3ff}
.question-text{font-size:16px;font-weight:600;color:#333;line-height:1.5}
.question-type{display:inline-block;background:#4facfe;color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;margin-bottom:10px}
/* 听写题型 */
.dict-hint{font-size:13px;color:#777;margin:2px 0 12px}
.dict-input{width:100%;padding:12px 15px;font-size:16px;border:2px solid #e0e3ff;border-radius:12px;outline:none;font-family:inherit;color:#333}
.dict-input:focus{border-color:#4facfe;background:#f0f7ff}
.dict-result{margin-top:14px;padding:12px 15px;border-radius:12px;font-size:15px;font-weight:600;line-height:1.5}
.dict-result.ok{background:#e8f5e9;color:#2e7d32;border:2px solid #4caf50}
.dict-result.no{background:#ffebee;color:#c62828;border:2px solid #f44336}
/* 课文跟读 */
.mode-grid-3{grid-template-columns:1fr 1fr 1fr}
.mode-grid-3 .mode-card{padding:16px 6px}
.mode-grid-3 .mode-icon{font-size:28px}
.mode-grid-3 .mode-name{font-size:13px}
.mode-grid-3 .mode-desc{font-size:10px}
.read-progress{text-align:center;font-size:15px;color:#555;margin-bottom:8px}
.read-progress b{color:#ff9800;font-size:20px}
.read-sec-tag{display:inline-block;background:#fff3e0;color:#e65100;border:1px solid #ffcc80;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.read-progress-bar{background:#eef1ff;border-radius:10px;height:8px;overflow:hidden;margin-bottom:14px}
.read-progress-fill{background:linear-gradient(90deg,#4caf50,#8bc34a);height:100%;border-radius:10px;transition:width .3s}
.read-box{text-align:left}
.read-speaker{font-size:12px;color:#ff9800;font-weight:700;margin-bottom:4px}
.read-en{font-size:17px;font-weight:600;color:#333;line-height:1.6}
.read-cn{font-size:13px;color:#888;margin-top:8px;line-height:1.6}
.read-tip{text-align:center;font-size:13px;color:#4facfe;margin:4px 0 2px}
/* 字幕滚播 */
.read-subs{position:relative;max-height:48vh;overflow-y:auto;border:2px solid #e0e3ff;border-radius:14px;background:#0f1830;padding:10px 12px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.sub-head{font-size:12px;font-weight:700;color:#ffd54f;margin:12px 2px 6px;padding-bottom:4px;border-bottom:1px dashed rgba(255,213,79,.35)}
.sub-head:first-child{margin-top:2px}
.sub-page{font-weight:400;color:#90caf9;font-size:11px;margin-left:6px}
.sub-row{padding:8px 10px;border-radius:10px;margin:4px 0;cursor:pointer;transition:background .25s;border:1px solid transparent}
.sub-row.cur{background:rgba(79,172,254,.22);border-color:rgba(79,172,254,.6)}
.sub-row:not(.cur):hover{background:rgba(255,255,255,.06)}
.sub-line{font-size:14.5px;line-height:1.55;color:#cfd8ea}
.sub-row.cur .sub-line{color:#fff}
.sub-speaker{color:#ffb74d;font-weight:700;margin-right:6px}
.sub-row.cur .sub-speaker{color:#ffd54f}
.sub-cn{font-size:11.5px;color:#8fa0bd;margin-top:2px;line-height:1.5}
.sub-row.cur .sub-cn{color:#b9e4ff}
.read-ctrl-row{display:flex;gap:8px}
.read-ctrl{margin-top:10px;flex:1;font-size:14px;padding:12px 4px}
.read-ctrl:disabled{opacity:.4}
/* 面包屑导航（固定顶部） */
.crumb-wrap{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#3d8bd9,#00c6fb);box-shadow:0 2px 8px rgba(0,0,0,.18);padding:8px 14px;display:none;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.crumb-wrap.show{display:flex}
.crumb-item{color:#eaf6ff;cursor:pointer;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap}
.crumb-item:hover{background:rgba(255,255,255,.18)}
.crumb-item.cur{background:rgba(255,255,255,.92);color:#1976d2;cursor:default}
.crumb-sep{color:rgba(255,255,255,.7);font-weight:700}
/* 跟读自动模式（滑动开关 + 停顿滑条，同一行） */
.read-auto-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.auto-switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.auto-switch input{display:none}
.auto-track{position:relative;width:46px;height:26px;border-radius:13px;background:#d5d9ee;transition:background .25s;flex:0 0 auto}
.auto-track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .25s}
.auto-switch input:checked+.auto-track{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.auto-switch input:checked+.auto-track::after{left:23px}
.auto-sw-label{font-size:13px;font-weight:700;color:#666}
.auto-switch input:checked~.auto-sw-label{color:#1976d2}
.auto-int{display:flex;align-items:center;gap:8px}
.auto-int-label{font-size:12px;font-weight:700;color:#666;flex:0 0 auto}
.auto-int-range{width:96px;height:5px;accent-color:#4facfe;cursor:pointer}
.auto-int-val{font-size:12px;font-weight:700;color:#4facfe;min-width:34px;text-align:center;flex:0 0 auto}
.auto-int-range:disabled{opacity:.4;cursor:not-allowed}
/* 单词跟读大卡：只显示当前播音词，上英下中 */
.word-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:230px;background:linear-gradient(160deg,#f8f9ff,#eef3ff);border:2px solid #e0e3ff;border-radius:18px;padding:24px 18px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.word-stage:active{transform:scale(.98)}
.word-en{font-size:44px;font-weight:800;color:#1a2456;line-height:1.25;text-align:center;word-break:break-word}
.word-cn{font-size:24px;font-weight:600;color:#4facfe;text-align:center;line-height:1.5}
/* 语速滑条（跟读/听写/闯关等有朗读的界面通用） */
.rate-setup{margin:10px 0 2px}
.rate-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px;}
.rate-label{font-size:12px;font-weight:700;color:#666;flex:0 0 auto}
.rate-range{flex:1 1 120px;max-width:180px;height:5px;accent-color:#4facfe;cursor:pointer}
.rate-val{font-size:12px;font-weight:700;color:#4facfe;min-width:36px;text-align:center;flex:0 0 auto}
/* 单元模式选择 */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.mode-card{background:#f8f9ff;border:2px solid #e0e3ff;border-radius:15px;padding:22px 12px;text-align:center;cursor:pointer;transition:all .3s}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.mode-card.disabled{opacity:.4;cursor:not-allowed}
.mode-icon{font-size:36px;display:block;margin-bottom:8px}
.mode-name{font-size:15px;font-weight:700;color:#333}
.mode-desc{font-size:11px;color:#888;margin-top:6px;line-height:1.5}
.mode-foot{font-size:12px;color:#888;text-align:center;margin-top:14px}
.mode-foot a{color:#4facfe}
/* 课本音视频 */
.media-list{border:2px solid #e0e3ff;border-radius:14px;overflow:hidden;background:#fff}
.media-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #f0f2ff}
.media-row:last-child{border-bottom:none}
.media-name{flex:1;font-size:14px;font-weight:600;color:#333}
.media-play{width:auto;flex:0 0 auto;margin-top:0;padding:8px 16px;font-size:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff;cursor:pointer;font-weight:600}
.media-play.playing{background:linear-gradient(135deg,#ff9800,#ff5722)}
/* 侧栏播放器 */
.mp-wrap{display:flex;gap:12px;align-items:flex-start;margin-top:4px}
.mp-side{flex:0 0 38%;max-width:190px;border:2px solid #e0e3ff;border-radius:14px;background:#fff;overflow:hidden;max-height:62vh;overflow-y:auto;transition:flex-basis .25s ease}
.mp-side.collapsed{flex:0 0 46px}
.mp-side-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#888;padding:9px 12px;background:#f8f9ff;border-bottom:1px solid #eef1ff;position:sticky;top:0}
.mp-side-label{flex:1;white-space:nowrap;overflow:hidden}
.mp-collapse{flex:0 0 auto;border:none;background:#eef1ff;color:#8a94c6;border-radius:7px;width:22px;height:22px;font-size:10px;cursor:pointer;line-height:1}
.mp-collapse:hover{background:#dfe6ff;color:#4facfe}
.mp-side.collapsed .mp-side-title{justify-content:center;padding:9px 4px}
.mp-side.collapsed .mp-side-label{display:none}
.mp-side.collapsed .mp-collapse{transform:rotate(180deg)}
.mp-item{display:flex;align-items:center;gap:7px;padding:10px 12px;font-size:13px;color:#444;cursor:pointer;border-bottom:1px solid #f5f7ff;transition:background .2s}
.mp-item:last-child{border-bottom:none}
.mp-item:hover{background:#f0f7ff}
.mp-item.sel{background:linear-gradient(135deg,#e3f2fd,#eef9ff);color:#1976d2;font-weight:700;border-left:3px solid #4facfe}
.mp-ico{flex:0 0 auto}
.mp-name{flex:1;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-side.collapsed .mp-item{justify-content:center;padding:10px 0}
.mp-side.collapsed .mp-name,.mp-side.collapsed .mp-cc{display:none}
.mp-side.collapsed .mp-item.sel{border-left-width:2px}
.mp-cc{flex:0 0 auto;font-size:9px;font-weight:800;color:#2e7d32;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:5px;padding:1px 4px}
.mp-main{flex:1;min-width:0}
.mp-audio-card{background:linear-gradient(160deg,#f8f9ff,#eef3ff);border:2px solid #e0e3ff;border-radius:16px;padding:22px 16px;text-align:center}
.mp-audio-name{font-size:17px;font-weight:800;color:#1a2456;margin-bottom:14px}
.mp-audio-card audio{width:100%}
.mp-sub-panel{margin-top:10px;border:2px solid #e0e3ff;border-radius:14px;background:#0f1830;max-height:34vh;overflow-y:auto;padding:8px 10px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.mp-sub-panel:empty{display:none}
.mp-sub-empty{font-size:12px;color:#8fa0bd;text-align:center;padding:12px 4px}
.mp-cue{font-size:14px;line-height:1.55;color:#cfd8ea;padding:7px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.mp-cue:hover{background:rgba(255,255,255,.06)}
.mp-cue.cur{background:rgba(79,172,254,.22);border-color:rgba(79,172,254,.6);color:#fff;font-weight:600}
.video-item{margin-top:14px}
.video-item-title{font-size:14px;font-weight:700;color:#333;margin-bottom:8px}
.video-item video{width:100%;border-radius:12px;background:#000;display:block;max-height:56vh}
/* 跟读小节标题行的板块播放按钮 */
.sub-head-play{display:inline-block;width:auto;margin:0 0 0 8px;padding:3px 10px;font-size:11px;vertical-align:middle;border-radius:9px}
/* 听写模式 */
.dict-setup-label{font-size:13px;color:#666;margin:12px 0 8px;text-align:center}
.interval-row{display:flex;gap:10px;justify-content:center;margin-bottom:5px}
.interval-btn{flex:1;max-width:110px;padding:10px;border:2px solid #e0e3ff;border-radius:12px;background:#fff;font-size:14px;font-weight:600;color:#666;cursor:pointer}
.interval-btn.selected{border-color:#4facfe;background:#e3f2fd;color:#1976d2}
.dict-stage{text-align:center}
.dict-progress{font-size:22px;color:#333;margin-bottom:10px}
.dict-progress b{color:#ff9800;font-size:28px}
.dict-tip{font-size:14px;color:#777;line-height:1.8}
.dict-rep{color:#4facfe;font-weight:600}
.dict-note{font-size:11px;color:#aaa;text-align:center;margin-top:10px;line-height:1.6}
.dict-nav-row{display:flex;gap:10px;margin-top:10px}
.dict-nav{margin-top:0;flex:1;font-size:14px;padding:12px}
.check-list{max-height:46vh;overflow-y:auto;border:1px solid #e0e3ff;border-radius:12px;background:#fff}
.check-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f0f2ff;font-size:13px}
.check-row:last-child{border-bottom:none}
.check-no{width:24px;color:#aaa;font-weight:700;flex-shrink:0}
.check-en{flex:1;font-weight:600;color:#333}
.check-cn{flex:1;color:#777;font-size:12px}
.check-box{width:22px;height:22px;accent-color:#4caf50;flex-shrink:0}
/* 听写记录 */
.rec-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.rec-unit{background:#f0f7ff;border:1px solid #d6eaff;border-radius:10px;padding:6px 10px;font-size:12px;color:#345}
.rec-list{border:1px solid #e0e3ff;border-radius:12px;overflow:hidden}
.rec-row{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid #f0f2ff;font-size:12px}
.rec-row:last-child{border-bottom:none}
.rec-date{color:#888;flex-shrink:0}
.rec-unit-name{flex:1;font-weight:600;color:#333}
.rec-score{color:#ff9800;font-weight:700}
.rec-int{color:#aaa;font-size:11px}
/* 朗读 */
.speak-btn{display:inline-block;background:#fff;border:1px solid #c5cae9;border-radius:50%;width:28px;height:28px;line-height:26px;text-align:center;font-size:13px;cursor:pointer;margin-left:8px;color:#5c6bc0;vertical-align:middle;user-select:none}
.speak-btn:hover{background:#e8eaf6;transform:scale(1.1)}
.auto-toggle{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:20px;font-size:11px;padding:4px 10px;cursor:pointer;margin-left:6px}
.auto-toggle.on{background:#ffd700;color:#7a4f00;border-color:#ffd700}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#fff;border:2px solid #e0e3ff;border-radius:12px;padding:12px 15px;font-size:14px;color:#333;cursor:pointer;transition:all .2s;text-align:left}
.option:hover{border-color:#4facfe;background:#f0f7ff}
.option.selected{border-color:#4facfe;background:#e3f2fd}
.option.correct{border-color:#4caf50;background:#e8f5e9}
.option.wrong{border-color:#f44336;background:#ffebee}
.btn{display:block;width:100%;padding:8px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:15px}
.btn-next{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff}
.btn-next:hover{opacity:.9}
.btn-next:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-reset{background:transparent;color:#999;font-size:12px;padding:8px;margin-top:10px;cursor:pointer;border:none}
/* 结果界面 */
.result-box{text-align:center;padding:30px 20px}
.result-icon{font-size:64px;margin-bottom:15px}
.result-title{font-size:20px;font-weight:700;color:#333;margin-bottom:10px}
.result-score{font-size:28px;font-weight:800;color:#ff9800;margin-bottom:15px}
.result-msg{font-size:14px;color:#666;line-height:1.6;margin-bottom:20px}
/* 反馈 */
.feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;z-index:100;opacity:0;pointer-events:none;transition:all .5s;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
.feedback.correct{color:#4caf50}
.feedback.wrong{color:#f44336}
/* 底部 */
.footer{padding:10px 20px;text-align:center;font-size:11px;color:#999;border-top:1px solid #eee}
.btn-reset-wrap{text-align:center;padding:0 0 15px}
/* 常驻法律信息入口 */
.legal-line{padding:0 20px 14px;text-align:center;font-size:11px;color:#aaa;line-height:1.6;border-top:1px solid #f2f2f6}
.legal-line a{color:#8a94c6;text-decoration:none;border-bottom:1px dotted #b9c0e0;padding-bottom:1px}
/* 免责声明弹窗 */
.dlg-mask{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,20,40,.62);z-index:200;display:none;justify-content:center;align-items:center;padding:18px}
.dlg-mask.show{display:flex}
.dlg{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dlg-head{background:linear-gradient(135deg,#4facfe,#00f2fe);padding:14px 18px;color:#fff;font-size:16px;font-weight:700;flex:0 0 auto;text-shadow:0 1px 3px rgba(0,0,0,.2)}
.dlg-body{padding:14px 18px 4px;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:12.5px;line-height:1.75;color:#444;flex:1 1 auto}
.dlg-body h4{font-size:13px;color:#1976d2;margin:13px 0 4px}
.dlg-body p{margin:0 0 6px}
.dlg-body ul{padding-left:18px;margin:0 0 6px}
.dlg-body li{margin:3px 0}
.dlg-body .warn{background:#fff3e0;border-left:3px solid #ff9800;padding:8px 10px;border-radius:6px;margin:8px 0;color:#8a5a00}
.dlg-foot{padding:10px 18px 16px;flex:0 0 auto;background:#fff}
.dlg-foot .btn{margin-top:0}
.dlg-alt{display:block;width:100%;margin-top:6px;background:transparent;border:none;color:#999;font-size:12px;padding:8px;cursor:pointer}
/* ===================== 平板适配（优先 iPad mini 744×1133） =====================
   用 pointer:coarse（触屏、无鼠标）区分平板与电脑：电脑端外观完全不变，
   iPad / 安卓平板获得更大的卡片、字号与触控目标 */
@media (min-width: 600px) and (pointer: coarse) {
  body{padding:28px}
  #app{max-width:640px;border-radius:24px}
  .header{padding:24px 24px 18px}
  .header h1{font-size:24px}
  .header .sub{font-size:13px}
  .main{padding:24px 26px}
  /* 关卡地图：3 列（6 本书=2行 / 8 单元=3行） */
  .grid{grid-template-columns:1fr 1fr 1fr;gap:14px}
  .card{padding:18px 14px}
  .card .icon{font-size:40px}
  .card .name{font-size:14px}
  .map-title{font-size:18px}
  /* 单元模式选择 */
  .mode-grid{gap:14px}
  .mode-card{padding:26px 14px}
  .mode-icon{font-size:42px}
  .mode-name{font-size:16px}
  .mode-desc{font-size:12px}
  .mode-grid-3 .mode-card{padding:20px 8px}
  .mode-grid-3 .mode-icon{font-size:32px}
  .mode-grid-3 .mode-name{font-size:14px}
  .mode-grid-3 .mode-desc{font-size:11px}
  /* 答题 / 跟读 / 听写：字号与触控目标整体放大 */
  .quiz-title{font-size:17px}
  .question-box{padding:22px}
  .question-text{font-size:19px}
  .option{font-size:16px;padding:14px 16px;border-radius:14px}
  .btn{font-size:17px;padding:12px;border-radius:14px}
  .speak-btn{width:36px;height:36px;line-height:34px;font-size:16px}
  .auto-toggle{font-size:12px;padding:5px 12px}
  .read-subs{max-height:52vh;padding:14px 16px}
  .mp-side{flex-basis:30%;max-width:230px}
  .mp-item{font-size:14px;padding:12px 14px}
  .mp-cue{font-size:15.5px}
  .mp-sub-panel{max-height:40vh}
  .word-stage{min-height:300px}
  .word-en{font-size:54px}
  .word-cn{font-size:28px}
  .sub-line{font-size:16px}
  .sub-cn{font-size:12.5px}
  .sub-head{font-size:13px}
  .read-en{font-size:19px}
  .read-cn{font-size:14px}
  .read-ctrl{font-size:15px;padding:13px 4px}
  .auto-int-range{width:140px}
  .auto-sw-label,.auto-int-label,.auto-int-val{font-size:13px}
  .rate-row{padding:11px 16px}
  .rate-range{max-width:220px}
  .dict-input{font-size:18px;padding:14px 16px}
  .dict-progress{font-size:24px}
  .dict-progress b{font-size:30px}
  .dict-tip{font-size:15px}
  .interval-btn{max-width:130px;font-size:15px;padding:12px}
  .check-en,.check-cn{font-size:14px}
  .crumb-wrap{font-size:13px;padding:10px 16px}
  .dlg{max-width:640px}
  .dlg-body{font-size:13.5px}
}
/* iPad mini 横屏（1133×744）及更大平板：版心加宽，地图 4 列（8 单元=2行） */
@media (min-width: 1000px) and (pointer: coarse) {
  #app{max-width:780px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .read-subs{max-height:56vh}
}
